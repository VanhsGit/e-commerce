<nz-layout class="admin-root" style="min-height: 100vh">
  <nz-sider
    [nzCollapsible]="true"
    [nzCollapsed]="isCollapsed()"
    [nzTrigger]="null"
    nzWidth="256"
    nzTheme="dark"
    class="admin-sider"
  >
    <div class="brand-logo" [title]="'E-Commerce Admin'">
      <span class="logo-badge">
        <i class="fa fa-bolt"></i>
      </span>
      <span *ngIf="!isCollapsed()">E-Commerce</span>
    </div>

    <div class="flex-1 overflow-y-auto overflow-x-hidden pb-4">
      <ng-container *ngFor="let group of menuGroups; let first = first">
        <div *ngIf="!first && !isCollapsed()" class="menu-group-title">
          {{ group.title }}
        </div>
        <a
          *ngFor="let item of group.items"
          nz-tooltip
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === 'dashboard' }"
          class="nav-link"
          [nzTooltipTitle]="isCollapsed() ? item.label : null"
          nzTooltipPlacement="right"
        >
          <i class="fa" [ngClass]="item.icon"></i>
          <span *ngIf="!isCollapsed()">{{ item.label }}</span>
        </a>
      </ng-container>
    </div>

    <div *ngIf="!isCollapsed()" class="border-t border-white/5 px-6 py-4">
      <div
        class="mb-1 text-[11px] font-bold uppercase tracking-wider text-slate-500"
      >
        Phiên bản
      </div>
      <div class="text-sm text-slate-300">Admin v1.0.0</div>
    </div>
  </nz-sider>

  <nz-layout>
    <nz-header
      class="admin-header flex items-center justify-between gap-4 px-4 md:px-8"
      style="height: 64px; padding: 0"
    >
      <div class="flex items-center gap-4">
        <button
          nz-button
          nzType="text"
          type="button"
          class="!h-10 !w-10 !mr-6"
        ></button>
        <nz-breadcrumb class="hidden md:block">
          <nz-breadcrumb-item
            *ngFor="let crumb of breadcrumbs | async; let last = last"
          >
            <a
              *ngIf="!last && crumb.url"
              [routerLink]="crumb.url"
              class="text-slate-500 hover:text-sky-600"
            >
              {{ crumb.label }}
            </a>
            <span *ngIf="last" class="font-semibold text-slate-800">
              {{ crumb.label }}
            </span>
          </nz-breadcrumb-item>
        </nz-breadcrumb>
      </div>

      <div class="flex items-center gap-3">
        <button
          nz-button
          nzType="text"
          type="button"
          nz-tooltip
          nzTooltipTitle="Thông báo"
          class="!h-10 !w-10 relative"
        >
          <nz-badge [nzCount]="0" [nzDot]="true">
            <i class="fa fa-bell-o text-lg text-slate-600"></i>
          </nz-badge>
        </button>

        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <ul nz-menu class="admin-user-menu">
            <li nz-menu-item nzDisabled class="!cursor-default">
              <div class="py-1">
                <div class="text-sm font-bold text-slate-800">
                  {{ user()?.displayName || "Quản trị viên" }}
                </div>
                <div class="text-xs text-slate-500">
                  {{ user()?.email }}
                </div>
              </div>
            </li>
            <li nz-menu-divider></li>
            <li nz-menu-item (click)="logout()">
              <i class="fa fa-sign-out mr-2 text-rose-500"></i>
              <span class="font-medium text-slate-700">Đăng xuất</span>
            </li>
          </ul>
        </nz-dropdown-menu>

        <button
          nz-button
          nz-dropdown
          nzType="text"
          type="button"
          nzPlacement="bottomRight"
          [nzDropdownMenu]="userMenu"
          nzTrigger="click"
          class="!h-10 !px-2 flex items-center gap-3 admin-user-btn"
        >
          <nz-avatar
            [nzSize]="34"
            nzShape="circle"
            style="background: linear-gradient(135deg, #0ea5e9, #6366f1)"
          >
            <span class="font-bold">
              {{
                (user()?.displayName || user()?.email || "U")
                  .charAt(0)
                  .toUpperCase()
              }}
            </span>
          </nz-avatar>
          <div class="hidden sm:block text-left leading-tight">
            <div class="text-sm font-semibold text-slate-800">
              {{ user()?.displayName || user()?.email }}
            </div>
            <div class="text-xs text-slate-500">
              {{ user()?.email }}
            </div>
          </div>
          <i class="fa fa-angle-down text-xs text-slate-400"></i>
        </button>
      </div>
    </nz-header>

    <nz-content class="admin-content bg-[#f0f2f5] p-4 md:p-6">
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
