<div class="min-h-screen bg-slate-100">
  <div class="mx-auto flex max-w-[1600px]">
    <aside class="sticky top-0 hidden h-screen w-72 shrink-0 border-r border-slate-200 bg-slate-950 p-5 text-white lg:block">
      <a routerLink="/admin" class="mb-7 block rounded-xl bg-gradient-to-r from-sky-600 to-indigo-600 p-4">
        <div class="text-xs font-bold uppercase tracking-[.25em] text-sky-100">Administration</div>
        <div class="mt-1 text-xl font-black">E-Commerce</div>
      </a>
      <nav class="space-y-1" aria-label="Admin navigation">
        <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="bg-white/15 text-white" class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-300 transition hover:bg-white/10 hover:text-white">
          <i class="fa w-5 text-center" [ngClass]="link.icon"></i><span>{{ link.label }}</span>
        </a>
      </nav>
      <a routerLink="/" class="mt-8 flex items-center gap-2 px-4 text-sm text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i> Về cửa hàng</a>
    </aside>

    <main class="min-w-0 flex-1">
      <header class="sticky top-0 z-30 flex items-center justify-between border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur lg:px-8">
        <button nz-button type="button" class="lg:!hidden" (click)="mobileOpen.set(!mobileOpen())"><i class="fa fa-bars"></i></button>
        <h1 class="text-lg font-black text-slate-900">Quản trị dữ liệu</h1>
        <a routerLink="/" class="text-sm font-semibold text-sky-700">Xem website</a>
      </header>
      <nav *ngIf="mobileOpen()" class="grid grid-cols-2 gap-2 border-b bg-slate-950 p-3 text-white lg:hidden">
        <a *ngFor="let link of links" [routerLink]="link.path" (click)="mobileOpen.set(false)" class="rounded bg-white/10 px-3 py-2 text-sm">{{ link.label }}</a>
      </nav>
      <div class="p-4 lg:p-8"><router-outlet></router-outlet></div>
    </main>
  </div>
</div>
