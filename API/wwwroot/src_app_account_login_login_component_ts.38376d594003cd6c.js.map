<div class="space-y-2">
  <label
    *ngIf="label"
    [for]="name"
    class="block text-sm font-medium text-slate-700"
  >
    {{ label }}
  </label>

  <input
    nz-input
    [id]="name"
    [name]="name"
    [type]="type"
    [placeholder]="placeholder || label"
    [disabled]="disabled"
    [required]="required"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    (blur)="onBlur()"
    class="!h-12 !border-slate-200 !bg-white !text-slate-800 placeholder:!text-slate-400 focus:!border-sky-500 focus:!shadow-none"
  />
</div>
