<section id="bikes" class="bg-white py-20 md:py-24">
  <div class="mx-auto max-w-7xl px-4 md:px-8 lg:px-12">
    <div
      class="mb-12 flex flex-col items-start justify-between gap-6 md:flex-row md:items-end"
    >
      <div>
        <p
          class="mb-3 inline-flex items-center gap-2 rounded-full bg-sky-50 px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-sky-700"
        >
          <i class="fa fa-bicycle mr-1"></i> Bộ sưu tập xe điện
        </p>
        <h2
          class="text-3xl font-black tracking-tight text-slate-900 md:text-4xl"
        >
          Sản phẩm xe điện nổi bật
        </h2>
        <p class="mt-3 max-w-2xl text-slate-600">
          Từ xe máy điện cao cấp, xe đạp điện thành phố đến xe tải điện giao
          hàng và phụ tùng chính hãng – lựa chọn lý tưởng cho mọi nhu cầu.
        </p>
      </div>
      <button
        type="button"
        [routerLink]="listingPath"
        [queryParams]="allBikesQueryParams"
        nz-button
        nzType="default"
        class="!inline-flex !items-center !justify-center !rounded-full !border-sky-300 !text-sky-700 hover:!bg-sky-50"
      >
        Xem tất cả
      </button>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <app-product-card
        *ngFor="let p of featuredCardItems()"
        [product]="p"
      ></app-product-card>
    </div>
  </div>
</section>
