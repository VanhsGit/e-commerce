<div class="mx-auto max-w-xl px-4 py-12">
  <div
    class="rounded-xl border border-slate-200 bg-white p-8 shadow-lg shadow-slate-100"
  >
    <div class="mb-6 text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.28em] text-sky-600">
        Admin
      </p>
      <h1 class="mt-3 text-3xl font-bold text-slate-900">Create User</h1>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <app-cm-input
        label="Display name"
        name="displayName"
        type="text"
        placeholder="Display name"
        [value]="displayName"
        (valueChange)="displayName = $event"
      ></app-cm-input>

      <app-cm-input
        label="Email"
        name="email"
        type="email"
        placeholder="Email"
        [value]="email"
        (valueChange)="email = $event"
      ></app-cm-input>

      <app-cm-input
        label="Password"
        name="password"
        type="password"
        placeholder="Password"
        [value]="password"
        (valueChange)="password = $event"
      ></app-cm-input>

      <button
        nz-button
        nzType="primary"
        type="submit"
        class="!h-12 !w-full !text-base !font-semibold"
      >
        Create user
      </button>
    </form>
  </div>
</div>
