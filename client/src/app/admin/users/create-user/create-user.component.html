<div class="mx-auto max-w-xl px-4 py-12">
  <div
    class="rounded-xl border border-slate-200 bg-white p-8 shadow-lg shadow-slate-100"
  >
    <div class="mb-6 text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.28em] text-sky-600">
        Admin
      </p>
      <h1 class="mt-3 text-3xl font-bold text-slate-900">Create User</h1>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Display name</mat-label>
        <input
          matInput
          name="displayName"
          [ngModel]="displayName"
          (ngModelChange)="displayName = $event"
          placeholder="Display name"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          [ngModel]="email"
          (ngModelChange)="email = $event"
          placeholder="Email"
        />
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="!h-12 !w-full !text-base !font-semibold"
      >
        Create user
      </button>
    </form>
  </div>
</div>
