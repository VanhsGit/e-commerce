<div class="admin-shell">
  <app-admin-page-header
    title="Kho ảnh"
    subtitle="Ảnh lưu trên máy chủ, dùng lại được trong mọi form quản trị"
    [loading]="loading"
    (refresh)="load()"
  >
    <button mat-stroked-button type="button" (click)="fileInput.click()">
      <mat-icon svgIcon="mini:attach_file"></mat-icon>
      {{ selectedFile ? selectedFile.name : 'Chọn ảnh' }}
    </button>
    <input
      #fileInput
      class="hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      (change)="pick($event)"
    />
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="!selectedFile || uploading"
      (click)="upload()"
    >
      <mat-spinner *ngIf="uploading" diameter="18" class="mr-2"></mat-spinner>
      <mat-icon *ngIf="!uploading" svgIcon="mini:cloud_upload"></mat-icon>Tải ảnh lên
    </button>
  </app-admin-page-header>

  <div class="m-4 space-y-4">
    <div class="admin-card">
      <div class="admin-filter admin-toolbar !border-b-0 !pb-0">
        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="w-full sm:w-[320px]"
        >
          <mat-label>Tìm theo tên file hoặc định dạng</mat-label>
          <input
            matInput
            name="media-search"
            [(ngModel)]="search"
            (keyup.enter)="load()"
          />
          <mat-icon matSuffix class="text-slate-400" svgIcon="mini:search"></mat-icon>
        </mat-form-field>
        <button mat-flat-button color="primary" type="button" (click)="load()">
          <mat-icon svgIcon="mini:search"></mat-icon>Tìm kiếm
        </button>
        <button mat-stroked-button type="button" (click)="clearSearch()">
          Xóa lọc
        </button>

        <span class="hidden flex-1 sm:block"></span>

        <mat-chip class="admin-chip chip-blue">
          Tổng: {{ images.length }} ảnh
        </mat-chip>
      </div>
    </div>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div
      *ngIf="images.length; else emptyMedia"
      class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    >
      <mat-card *ngFor="let image of images" class="overflow-hidden">
        <img
          [src]="image.url"
          [alt]="image.originalFileName"
          class="h-48 w-full border-b border-slate-200 object-cover"
        />
        <mat-card-content class="space-y-2 !p-3">
          <div class="break-all text-sm font-semibold text-slate-800">
            {{ image.originalFileName }}
          </div>
          <div class="text-xs text-slate-500">
            {{ image.mimeType }} ·
            {{ image.fileSize / 1024 | number: '1.0-1' }} KB
          </div>
          <div class="break-all text-xs text-slate-500">{{ image.url }}</div>
        </mat-card-content>
        <mat-card-actions class="!px-3 !pb-3">
          <button mat-stroked-button type="button" (click)="copyUrl(image)">
            <mat-icon svgIcon="mini:content_copy"></mat-icon>Sao chép URL
          </button>
          <button
            mat-stroked-button
            color="warn"
            type="button"
            (click)="remove(image)"
          >
            <mat-icon svgIcon="mini:delete"></mat-icon>Xóa
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
    <ng-template #emptyMedia>
      <div class="admin-card">
        <app-admin-empty-state
          message="Kho ảnh chưa có dữ liệu"
          hint="Tải ảnh lên để dùng lại trong các form quản trị"
          icon="photo_library"
        ></app-admin-empty-state>
      </div>
    </ng-template>
  </div>
</div>
