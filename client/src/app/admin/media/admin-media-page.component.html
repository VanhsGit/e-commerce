<div class="admin-shell">
  <app-admin-page-header
    title="Kho ảnh"
    subtitle="Ảnh lưu trên máy chủ, dùng lại được trong mọi form quản trị"
    [loading]="loading"
    (refresh)="load()"
  >
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="uploading"
      (click)="fileInput.click()"
    >
      <mat-spinner *ngIf="uploading" diameter="18" class="mr-2"></mat-spinner>
      <mat-icon *ngIf="!uploading" svgIcon="mini:cloud_upload"></mat-icon>
      {{ uploading ? "Đang tải..." : "Tải ảnh lên" }}
    </button>
    <input
      #fileInput
      class="hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      (change)="pick($event)"
    />
  </app-admin-page-header>

  <div class="admin-page-content space-y-5">
    <div class="admin-card">
      <div class="admin-filter admin-toolbar !border-b-0 !pb-0">
        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="admin-filter-search"
        >
          <mat-label>Tìm theo tên file</mat-label>
          <input
            matInput
            name="media-search"
            [ngModel]="search"
            (ngModelChange)="onSearchChange($event)"
          />
          <button
            *ngIf="search"
            matSuffix
            mat-icon-button
            type="button"
            aria-label="Xóa tìm kiếm"
            (click)="clearSearch()"
          >
            <mat-icon class="text-slate-400" svgIcon="mini:close"></mat-icon>
          </button>
          <mat-icon
            *ngIf="!search"
            matSuffix
            class="text-slate-400"
            svgIcon="mini:search"
          ></mat-icon>
        </mat-form-field>
      </div>
    </div>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div
      *ngIf="images.length; else emptyMedia"
      class="admin-media-grid"
    >
      <mat-card *ngFor="let image of images" class="admin-media-card overflow-hidden">
        <div class="admin-media-thumb">
          <img [src]="image.url" [alt]="image.originalFileName" />
        </div>
        <mat-card-content class="!p-2.5">
          <div
            class="truncate text-xs font-semibold text-slate-800"
            [matTooltip]="image.originalFileName"
          >
            {{ image.originalFileName }}
          </div>
          <div class="text-[11px] text-slate-500">
            {{ image.fileSize / 1024 | number: "1.0-1" }} KB
          </div>
        </mat-card-content>
        <mat-card-actions class="admin-media-card__actions !p-2 !pt-0">
          <button
            mat-icon-button
            class="admin-action-btn view"
            type="button"
            matTooltip="Sao chép URL"
            (click)="copyUrl(image)"
          >
            <mat-icon svgIcon="mini:content_copy"></mat-icon>
          </button>
          <button
            mat-icon-button
            class="admin-action-btn delete"
            type="button"
            matTooltip="Xóa"
            (click)="remove(image)"
          >
            <mat-icon svgIcon="mini:delete"></mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
    <ng-template #emptyMedia>
      <div class="admin-card">
        <app-admin-empty-state
          message="Kho ảnh chưa có dữ liệu"
          hint="Tải ảnh lên để dùng lại trong các form quản trị"
          icon="photo_library"
        ></app-admin-empty-state>
      </div>
    </ng-template>
  </div>
</div>
