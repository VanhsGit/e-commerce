<div class="admin-shell">
  <app-admin-page-header
    title="Bảng điều khiển"
    [subtitle]="
      'Xin chào ' +
      (user()?.displayName || user()?.email || 'Quản trị viên') +
      ' · tổng quan hoạt động của hệ thống'
    "
    [loading]="loading()"
    (refresh)="load()"
  >
    <button
      mat-flat-button
      color="primary"
      type="button"
      routerLink="/admin/electric-bikes"
    >
      <mat-icon svgIcon="mini:add"></mat-icon>Thêm sản phẩm
    </button>
    <button mat-stroked-button type="button" routerLink="/admin/companies">
      <mat-icon svgIcon="mini:apartment"></mat-icon>Quản lý công ty
    </button>
  </app-admin-page-header>

  <div class="admin-page-content space-y-5">
    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      <mat-card
        *ngFor="let stat of statCards()"
        appearance="outlined"
        class="stat-card h-full cursor-pointer !bg-white !shadow-sm transition-colors hover:!border-emerald-600"
        [routerLink]="stat.path"
      >
        <mat-card-content>
          <div class="flex items-start justify-between">
            <div>
              <div class="text-sm font-medium text-slate-500">
                {{ stat.title }}
              </div>
              <div class="mt-2 text-2xl font-semibold text-slate-900">
                {{ stat.value }}
                <span
                  *ngIf="stat.suffix"
                  class="text-base font-medium text-slate-400"
                >
                  {{ stat.suffix }}
                </span>
              </div>
              <div class="mt-2 text-xs text-slate-400">{{ stat.hint }}</div>
            </div>
            <div class="stat-icon">
              <mat-icon [svgIcon]="'hero:' + stat.icon"></mat-icon>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <mat-card appearance="outlined" class="!bg-white !shadow-sm">
      <mat-card-header>
        <mat-card-title class="!text-base !font-semibold !text-slate-900"
          >Sản phẩm mới nhất</mat-card-title
        >
      </mat-card-header>
      <mat-card-content>
        <ng-container *ngIf="!loading()">
          <app-admin-empty-state
            *ngIf="recentProducts().length === 0"
            message="Chưa có sản phẩm nào"
            icon="inventory_2"
          ></app-admin-empty-state>
          <div
            *ngFor="let p of recentProducts()"
            class="flex items-center gap-4 border-b border-slate-100 py-3 last:border-0"
          >
            <div class="product-image-frame w-10 shrink-0 rounded-lg border border-slate-200">
              <img [src]="imageOf(p)" [alt]="p.name" />
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate font-semibold text-slate-800">
                {{ p.name }}
              </div>
              <div class="text-xs text-slate-500">
                {{ p.brandName }} · {{ productCategoryLabel(p) }}
              </div>
            </div>
            <div class="text-right">
              <div class="font-semibold text-red-600">
                {{ p.price | vndCurrency }}
              </div>
              <div
                class="text-xs font-semibold"
                [ngClass]="
                  p.stockQuantity > 0 ? 'text-slate-500' : 'text-slate-400'
                "
              >
                {{
                  p.stockQuantity > 0 ? "Tồn: " + p.stockQuantity : "Hết hàng"
                }}
              </div>
            </div>
          </div>
        </ng-container>
      </mat-card-content>
    </mat-card>
  </div>
</div>
