<section class="space-y-3">
  <label *ngIf="label" class="block text-sm font-semibold text-slate-700">{{ label }}</label>

  <div class="overflow-hidden rounded border border-slate-300 bg-slate-50">
    <img
      *ngIf="value; else emptyPreview"
      [src]="value"
      [alt]="label"
      class="h-28 w-full object-cover"
    />
    <ng-template #emptyPreview>
      <div class="flex h-28 items-center justify-center text-sm text-slate-400">
        Chưa chọn ảnh
      </div>
    </ng-template>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <button
      mat-stroked-button
      type="button"
      [disabled]="uploading"
      (click)="fileInput.click()"
    >
      <mat-spinner *ngIf="uploading" diameter="18" class="mr-2"></mat-spinner>
      <mat-icon *ngIf="!uploading" svgIcon="mini:cloud_upload"></mat-icon>
      {{ uploading ? "Đang tải..." : "Tải ảnh lên" }}
    </button>
    <input
      #fileInput
      class="hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      (change)="pick($event)"
    />
    <button
      *ngIf="value"
      mat-stroked-button
      color="warn"
      type="button"
      (click)="clear()"
    >
      <mat-icon svgIcon="mini:delete"></mat-icon>Bỏ ảnh
    </button>
  </div>
</section>
