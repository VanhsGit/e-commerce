<section class="space-y-3">
  <label class="block text-sm font-semibold text-slate-700">{{ label }}</label>

  <div class="overflow-hidden rounded border border-slate-300 bg-slate-50">
    <img
      *ngIf="value; else emptyPreview"
      [src]="value"
      [alt]="label"
      class="h-40 w-full object-cover"
    />
    <ng-template #emptyPreview>
      <div class="flex h-40 items-center justify-center text-sm text-slate-400">
        Chưa chọn ảnh
      </div>
    </ng-template>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <button mat-stroked-button type="button" (click)="fileInput.click()">
      <mat-icon svgIcon="mini:attach_file"></mat-icon>Chọn file
    </button>
    <input
      #fileInput
      class="hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      (change)="pick($event)"
    />
    <span *ngIf="selectedFile" class="max-w-48 break-all text-xs text-slate-600">
      {{ selectedFile.name }}
    </span>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="!selectedFile || uploading"
      (click)="upload()"
    >
      <mat-icon *ngIf="!uploading" svgIcon="mini:cloud_upload"></mat-icon>
      <mat-spinner *ngIf="uploading" diameter="18" class="mr-2"></mat-spinner>
      Tải lên
    </button>
    <button mat-stroked-button type="button" (click)="openLibrary()">
      <mat-icon svgIcon="mini:photo_library"></mat-icon>Chọn từ kho ảnh
    </button>
    <button
      *ngIf="value"
      mat-stroked-button
      color="warn"
      type="button"
      (click)="clear()"
    >
      <mat-icon svgIcon="mini:delete"></mat-icon>Bỏ ảnh
    </button>
  </div>

  <div *ngIf="value" class="break-all text-xs text-slate-500">{{ value }}</div>
</section>

<ng-template #libraryDialog>
  <h2 mat-dialog-title>Chọn ảnh từ kho</h2>
  <mat-dialog-content>
    <div class="mb-4 flex items-start gap-2">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="flex-1">
        <mat-label>Tìm theo tên file hoặc định dạng</mat-label>
        <input matInput [(ngModel)]="search" (keyup.enter)="load()" />
        <button
          *ngIf="search"
          matSuffix
          mat-icon-button
          type="button"
          (click)="search = ''; load()"
        >
          <mat-icon svgIcon="mini:close"></mat-icon>
        </button>
      </mat-form-field>
      <button mat-flat-button color="primary" type="button" class="!h-14" (click)="load()">
        <mat-icon svgIcon="mini:search"></mat-icon>Tìm
      </button>
    </div>

    <mat-progress-bar *ngIf="loading" mode="indeterminate" class="mb-3"></mat-progress-bar>

    <div
      *ngIf="images.length; else noImages"
      class="grid max-h-[60vh] grid-cols-2 gap-3 overflow-y-auto md:grid-cols-4"
    >
      <button
        *ngFor="let image of images"
        type="button"
        class="overflow-hidden rounded border border-slate-300 bg-white text-left hover:border-sky-500"
        (click)="select(image)"
      >
        <img
          [src]="image.url"
          [alt]="image.originalFileName"
          class="h-28 w-full object-cover"
        />
        <span class="block break-all p-2 text-xs text-slate-700">
          {{ image.originalFileName }}
        </span>
      </button>
    </div>
    <ng-template #noImages>
      <app-admin-empty-state
        message="Kho ảnh chưa có dữ liệu"
        icon="photo_library"
      ></app-admin-empty-state>
    </ng-template>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="closeLibrary()">Đóng</button>
  </mat-dialog-actions>
</ng-template>
