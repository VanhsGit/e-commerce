<section class="space-y-4 border-t border-slate-200 pt-5">
  <h3 class="font-bold text-slate-800">Ảnh của entity</h3>
  <div class="grid gap-2 md:grid-cols-[1fr_160px_100px_auto]">
    <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" (change)="pick($event)" />
    <input nz-input [(ngModel)]="imageType" placeholder="Loại ảnh" />
    <input nz-input type="number" [(ngModel)]="sortOrder" placeholder="Thứ tự" />
    <button nz-button nzType="primary" type="button" [nzLoading]="uploading" [disabled]="!file" (click)="upload()">Upload</button>
  </div>
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    <article *ngFor="let image of images" class="rounded-lg border border-slate-200 p-3">
      <img [src]="image.url" [alt]="image.originalFileName" class="mb-3 h-32 w-full rounded object-cover" />
      <input nz-input [(ngModel)]="image.imageType" class="mb-2" />
      <input nz-input type="number" [(ngModel)]="image.sortOrder" class="mb-2" />
      <label class="mb-3 flex items-center gap-2 text-sm"><input type="checkbox" [(ngModel)]="image.isUsed" /> Đang dùng</label>
      <div class="flex gap-2"><button nz-button type="button" (click)="save(image)">Lưu</button><button nz-button nzDanger type="button" (click)="remove(image)">Xóa file</button></div>
    </article>
  </div>
</section>
