<div class="space-y-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
  <div
    *ngFor="let row of rows; let i = index"
    class="grid grid-cols-[1fr_1fr_auto] items-center gap-2"
  >
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Key</mat-label>
      <input matInput [(ngModel)]="row.key" (ngModelChange)="emit()" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Value</mat-label>
      <input matInput [(ngModel)]="row.value" (ngModelChange)="emit()" />
    </mat-form-field>
    <button
      mat-icon-button
      color="warn"
      type="button"
      matTooltip="Xóa dòng"
      (click)="remove(i)"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <p *ngIf="duplicateKeys" class="text-sm text-red-600">
    Metadata không được trùng key.
  </p>
  <button mat-stroked-button type="button" (click)="add()">
    <mat-icon>add</mat-icon>Thêm metadata
  </button>
</div>
