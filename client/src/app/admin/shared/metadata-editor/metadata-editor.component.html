<div class="space-y-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
  <div
    *ngFor="let row of rows; let i = index"
    class="grid grid-cols-1 items-start gap-2 sm:grid-cols-[minmax(0,1fr)_minmax(0,2fr)_auto]"
  >
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ fieldLabel(row.key, "key") }}</mat-label>
      <input matInput [(ngModel)]="row.key" (ngModelChange)="emit()" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ fieldLabel(row.key, "value") }}</mat-label>
      @if (isMultiline(row.key)) {
        <textarea
          matInput
          rows="4"
          [(ngModel)]="row.value"
          (ngModelChange)="emit()"
        ></textarea>
      } @else {
        <input matInput [(ngModel)]="row.value" (ngModelChange)="emit()" />
      }
    </mat-form-field>
    <button
      mat-icon-button
      color="warn"
      type="button"
      matTooltip="Xóa dòng"
      (click)="remove(i)"
    >
      <mat-icon svgIcon="mini:delete"></mat-icon>
    </button>
  </div>
  <p *ngIf="duplicateKeys" class="text-sm text-red-600">
    Metadata không được trùng key.
  </p>
  <button mat-stroked-button type="button" (click)="add()">
    <mat-icon svgIcon="mini:add"></mat-icon>Thêm metadata
  </button>
</div>
