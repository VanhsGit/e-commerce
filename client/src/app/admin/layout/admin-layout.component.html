<mat-sidenav-container class="admin-root">
  <!-- ================= SIDEBAR ================= -->
  <mat-sidenav
    class="admin-sider"
    [class.collapsed]="isCollapsed()"
    mode="side"
    opened
    disableClose
  >
    <!-- Logo -->
    <div class="brand-logo">
      <div class="logo-badge">
        <mat-icon svgIcon="hero:bolt"></mat-icon>
      </div>

      <div *ngIf="!isCollapsed()" class="flex min-w-0 flex-col leading-none">
        <span class="text-[15px] font-bold tracking-tight text-white">
          E-Commerce
        </span>

        <span
          class="mt-1 text-[10px] font-medium uppercase tracking-[0.18em] text-slate-500"
        >
          Administration
        </span>
      </div>
    </div>

    <!-- Navigation -->
    <div
      class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-5 flex flex-col justify-between"
    >
      <div>
        <ng-container *ngFor="let group of menuGroups; let first = first">
          <!-- Group title -->
          <div *ngIf="!first && !isCollapsed()" class="menu-group-title mt-7">
            {{ group.title }}
          </div>

          <!-- Collapsed divider -->
          <div
            *ngIf="!first && isCollapsed()"
            class="mx-3 my-4 border-t border-white/[0.06]"
          ></div>

          <!-- Menu item -->
          <a
            *ngFor="let item of group.items"
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === 'dashboard' }"
            class="nav-link"
            [matTooltip]="isCollapsed() ? item.label : ''"
            matTooltipPosition="right"
          >
            <span class="nav-icon">
              <mat-icon [svgIcon]="'hero:' + item.icon"></mat-icon>
            </span>

            <span *ngIf="!isCollapsed()" class="nav-label">
              {{ item.label }}
            </span>

            <span
              *ngIf="!isCollapsed() && item.path === 'dashboard'"
              class="ml-auto h-1.5 w-1.5 rounded-full bg-emerald-400"
            ></span>
          </a>
        </ng-container>
      </div>
      <div (click)="logout()" class="nav-link">
        <mat-icon [svgIcon]="'hero:logout'"></mat-icon>Đăng xuất
      </div>
    </div>

    <!-- Sidebar footer -->
    <div *ngIf="!isCollapsed()" class="border-t border-white/[0.06] px-5 py-4">
      <div class="flex items-center justify-between">
        <div>
          <div
            class="text-[10px] font-semibold uppercase tracking-[0.15em] text-slate-500"
          >
            Phiên bản
          </div>

          <div class="mt-1 text-xs font-medium text-slate-400">
            Admin v1.0.0
          </div>
        </div>

        <span
          class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.7)]"
          matTooltip="Hệ thống đang hoạt động"
        ></span>
      </div>
    </div>
  </mat-sidenav>

  <!-- ================= MAIN ================= -->
  <mat-sidenav-content class="admin-main">
    <main class="admin-content">
      <div class="admin-page-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
