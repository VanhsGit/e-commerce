<mat-sidenav-container class="admin-root">
  <!-- ================= SIDEBAR ================= -->
  <mat-sidenav
    class="admin-sider"
    [class.collapsed]="isCollapsed() && !isMobile()"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? mobileNavOpen() : true"
    [disableClose]="!isMobile()"
    (openedChange)="onSidenavOpenedChange($event)"
  >
    <!-- Logo -->
    <div class="brand-logo">
      <div class="logo-badge">
        <mat-icon svgIcon="hero:bolt"></mat-icon>
      </div>

      <div *ngIf="!isCollapsed() || isMobile()" class="flex min-w-0 flex-col leading-none">
        <span class="text-[15px] font-bold tracking-tight text-white">
          E-Commerce
        </span>

        <span
          class="mt-1 text-[10px] font-medium uppercase tracking-[0.18em] text-slate-500"
        >
          Administration
        </span>
      </div>
    </div>

    <!-- Navigation -->
    <div
      class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-5 flex flex-col justify-between"
    >
      <div>
        <ng-container *ngFor="let group of menuGroups(); let first = first">
          <!-- Group title -->
          <div *ngIf="!first && (!isCollapsed() || isMobile())" class="menu-group-title mt-7">
            {{ group.title }}
          </div>

          <!-- Collapsed divider -->
          <div
            *ngIf="!first && isCollapsed() && !isMobile()"
            class="mx-3 my-4 border-t border-white/[0.06]"
          ></div>

          <!-- Menu item -->
          <a
            *ngFor="let item of group.items"
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === 'dashboard' }"
            class="nav-link"
            [matTooltip]="isCollapsed() && !isMobile() ? item.label : ''"
            matTooltipPosition="right"
            (click)="closeMobileNav()"
          >
            <span class="nav-icon">
              <mat-icon [svgIcon]="'hero:' + item.icon"></mat-icon>
            </span>

            <span *ngIf="!isCollapsed() || isMobile()" class="nav-label">
              {{ item.label }}
            </span>
          </a>
        </ng-container>
      </div>

      <div class="border-t border-white/[0.06] pt-3">
        <div
          *ngIf="(!isCollapsed() || isMobile()) && user() as u"
          class="truncate px-3 pb-2 text-xs font-medium text-slate-400"
          [matTooltip]="u.displayName"
        >
          {{ u.displayName }}
        </div>
        <button type="button" class="nav-link w-full" (click)="logout()">
          <span class="nav-icon">
            <mat-icon svgIcon="hero:logout"></mat-icon>
          </span>
          <span *ngIf="!isCollapsed() || isMobile()" class="nav-label">Đăng xuất</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <!-- ================= MAIN ================= -->
  <mat-sidenav-content class="admin-main">
    <mat-toolbar class="admin-mobile-bar" *ngIf="isMobile()">
      <button
        mat-icon-button
        type="button"
        aria-label="Mở menu điều hướng"
        (click)="toggleMobileNav()"
      >
        <mat-icon svgIcon="hero:menu"></mat-icon>
      </button>
      <span class="admin-mobile-bar__title">E-Commerce Admin</span>
    </mat-toolbar>

    <main class="admin-content">
      <div class="admin-page-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
