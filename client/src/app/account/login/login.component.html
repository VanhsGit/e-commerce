<div class="flex min-h-[70vh] items-center justify-center px-4 py-12">
  <div
    class="w-full max-w-md border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60"
  >
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="text-center">
        <p
          class="text-sm font-semibold uppercase tracking-[0.28em] text-sky-600"
        >
          Welcome back
        </p>
        <h1 class="mt-3 text-3xl font-bold text-slate-900">Login</h1>
      </div>

      <app-cm-input
        label="Email address"
        name="email"
        type="email"
        placeholder="Email address"
        [value]="email"
        (valueChange)="email = $event"
      ></app-cm-input>

      <app-cm-input
        label="Password"
        name="password"
        type="password"
        placeholder="Password"
        [value]="password"
        (valueChange)="password = $event"
      ></app-cm-input>

      <button
        nz-button
        nzType="primary"
        type="submit"
        class="!h-12 !w-full !text-base !font-semibold"
      >
        Sign in
      </button>
    </form>
  </div>
</div>
