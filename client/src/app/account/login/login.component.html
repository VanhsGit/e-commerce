<div class="flex min-h-[70vh] items-center justify-center px-4 py-12">
  <div
    class="w-full max-w-md border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60"
  >
    <form (ngSubmit)="step === 'email' ? requestCode() : verifyCode()" class="space-y-6">
      <div class="text-center">
        <p
          class="text-sm font-semibold uppercase tracking-[0.28em] text-sky-600"
        >
          Welcome back
        </p>
        <h1 class="mt-3 text-3xl font-bold text-slate-900">Đăng nhập bằng OTP</h1>
        <p class="mt-2 text-sm text-slate-500">Giai đoạn development: mã OTP xuất hiện trong log backend.</p>
      </div>

      <app-cm-input
        label="Email address"
        name="email"
        type="email"
        placeholder="Email address"
        [value]="email"
        (valueChange)="email = $event"
      ></app-cm-input>

      <div *ngIf="step === 'otp'">
        <label class="mb-2 block text-sm font-semibold text-slate-700">Mã OTP 6 số</label>
        <input nz-input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" [(ngModel)]="code" class="!h-12 !text-center !text-xl !tracking-[.4em]" placeholder="000000" />
        <div class="mt-3 flex justify-between text-sm"><button type="button" class="text-sky-700" (click)="changeEmail()">Đổi email</button><button type="button" class="text-sky-700 disabled:text-slate-400" [disabled]="cooldown > 0" (click)="requestCode()">{{ cooldown > 0 ? 'Gửi lại sau ' + cooldown + 's' : 'Gửi lại mã' }}</button></div>
      </div>

      <button
        nz-button
        nzType="primary"
        type="submit"
        class="!h-12 !w-full !text-base !font-semibold"
      >
        {{ step === 'email' ? 'Nhận mã OTP' : 'Xác nhận và đăng nhập' }}
      </button>
    </form>
  </div>
</div>
