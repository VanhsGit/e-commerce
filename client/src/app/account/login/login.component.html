<div class="flex min-h-[70vh] items-center justify-center px-4 py-12">
  <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.28em] text-sky-600">Welcome back</p>
        <h1 class="mt-3 text-3xl font-bold text-slate-900">Login</h1>
      </div>

      <div class="space-y-2">
        <label for="inputEmail" class="block text-sm font-medium text-slate-700">Email address</label>
        <input nz-input formControlName="email" type="email" id="inputEmail" class="!h-12 !rounded-xl" placeholder="Email address" />
      </div>

      <div class="space-y-2">
        <label for="inputPassword" class="block text-sm font-medium text-slate-700">Password</label>
        <input nz-input formControlName="password" type="password" id="inputPassword" class="!h-12 !rounded-xl" placeholder="Password" />
      </div>

      <button nz-button nzType="primary" type="submit" class="!h-12 !w-full !rounded-xl !text-base !font-semibold">Sign in</button>
    </form>
  </div>
</div>
