<div class="mx-auto mt-8 max-w-6xl px-4">
  <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <nz-table [nzData]="orders()" [nzShowPagination]="false" [nzBordered]="false" class="!text-sm !text-slate-700">
      <thead>
        <tr>
          <th class="!px-6 !py-4 !font-semibold">Order</th>
          <th class="!px-6 !py-4 !font-semibold">Date</th>
          <th class="!px-6 !py-4 !font-semibold">Total</th>
          <th class="!px-6 !py-4 !font-semibold">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let order of orders()"
          routerLink="/orders/{{ order.id }}"
          class="cursor-pointer transition hover:bg-sky-50/60"
        >
          <td class="!px-6 !py-4 !font-semibold !text-slate-900"># {{ order.id }}</td>
          <td class="!px-6 !py-4">{{ order.orderDate | date: 'medium' }}</td>
          <td class="!px-6 !py-4">{{ order.total | currency }}</td>
          <td class="!px-6 !py-4">
            <span class="inline-flex rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-medium text-emerald-700">
              {{ order.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>
</div>
