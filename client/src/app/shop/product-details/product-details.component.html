<div class="mx-auto mt-8 max-w-6xl px-4" *ngIf="product">
  <div class="grid gap-8 lg:grid-cols-2">
    <div class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
      <img [src]="product.pictureUrl" [alt]="product.name" class="h-full w-full object-cover" />
    </div>

    <div class="flex flex-col justify-center">
      <p class="mb-3 text-xs font-semibold uppercase tracking-[0.25em] text-sky-600">Featured item</p>
      <h3 class="text-3xl font-bold text-slate-900">{{ product.name }}</h3>
      <p class="mt-4 text-2xl font-semibold text-slate-900">{{ product.price | currency }}</p>

      <div class="mt-6 flex items-center gap-4">
        <div class="flex items-center gap-3 rounded-full border border-slate-200 bg-slate-50 px-3 py-2 shadow-sm">
          <button
            type="button"
            (click)="decrementQuantity()"
            class="flex h-9 w-9 items-center justify-center rounded-full text-xl text-slate-700 transition hover:bg-slate-200"
            aria-label="Decrease quantity"
          >
            −
          </button>
          <span class="min-w-8 text-center text-xl font-semibold text-slate-900">{{ quantity }}</span>
          <button
            nz-button
            nzType="text"
            type="button"
            (click)="incrementQuantity()"
            class="!flex !h-9 !w-9 !items-center !justify-center !rounded-full !text-xl !text-slate-700 hover:!bg-slate-200"
            aria-label="Increase quantity"
          >
            +
          </button>
        </div>

        <button
          nz-button
          nzType="primary"
          type="button"
          (click)="addItemToBasket()"
          class="!rounded-xl !px-5 !py-3 !text-sm !font-semibold"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </div>

  <div class="mt-10 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h4 class="mb-3 text-xl font-semibold text-slate-900">Description</h4>
    <p class="leading-7 text-slate-600">{{ product.description }}</p>
  </div>
</div>
