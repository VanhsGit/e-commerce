<div class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg">
  <div class="relative overflow-hidden">
    <img src="{{ product.pictureUrl }}" alt="{{ product.name }}" class="h-72 w-full object-cover transition duration-500 group-hover:scale-105" />
    <div class="absolute inset-0 flex items-center justify-center gap-3 bg-slate-900/30 opacity-0 transition group-hover:opacity-100">
      <button
        (click)="addItemToBasket()"
        type="button"
        class="rounded-full bg-sky-600 p-3 text-white shadow-lg hover:bg-sky-500"
        aria-label="Add to basket"
      >
        <i class="fa fa-shopping-cart"></i>
      </button>
      <button
        routerLink="/shop/{{ product.id }}"
        type="button"
        class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-800 shadow-lg hover:bg-slate-100"
      >
        View
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-2 p-4">
    <a routerLink="/shop/{{ product.id }}" class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-700 hover:text-sky-600">
      {{ product.name }}
    </a>
    <span class="text-base font-bold text-slate-900">{{ product.price | currency }}</span>
  </div>
</div>
