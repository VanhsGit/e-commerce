<section id="commitments" data-trust-finale class="border-y border-slate-200 bg-slate-50">
  <h2 class="sr-only">{{ content.title }}</h2>
  <div class="mx-auto grid max-w-7xl gap-x-4 gap-y-3 px-4 py-4 sm:grid-cols-2 lg:grid-cols-4">
    <article *ngFor="let item of content.items" data-commitment-seal class="flex items-start gap-3">
      <span class="flex h-9 w-9 flex-none items-center justify-center rounded-md bg-emerald-50 text-emerald-600">
        <mat-icon [svgIcon]="'hero:' + item.icon"></mat-icon>
      </span>
      <div class="min-w-0">
        <h3 class="text-sm font-semibold text-slate-900">{{ item.title }}</h3>
        <p class="line-clamp-2 text-xs text-slate-600">{{ item.description }}</p>
      </div>
    </article>
  </div>
</section>
