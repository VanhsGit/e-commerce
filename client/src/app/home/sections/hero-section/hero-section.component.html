<section id="hero" data-hero-collage class="home-hero" [class.hero-mobile]="mobile">
  <div class="hero-introduction">
    <img appImgFallback class="hero-backdrop"
      [src]="mobile ? content.cards[1].imageSrc : content.cards[0].imageSrc"
      alt="" aria-hidden="true" fetchpriority="high" />
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-inner">
      <div data-hero-copy class="hero-copy min-w-0">
        <p class="hero-badge">
          <mat-icon svgIcon="hero:eco"></mat-icon>
          {{ content.badge }}
        </p>
        <h1 class="break-words" [class.text-white]="!mobile">
          {{ content.title }}
          <span>{{ content.highlightedTitle }}</span>
        </h1>
        <p class="hero-description">{{ content.description }}</p>
        @if (!mobile) {
          <div class="hero-actions">
            <a class="hero-contact" href="#cta">
              Kết nối với chúng tôi
              <mat-icon svgIcon="hero:arrow_forward"></mat-icon>
            </a>
            <a class="hero-warranty" href="#warranty">
              <mat-icon svgIcon="hero:verified_user"></mat-icon>
              Tra cứu bảo hành
            </a>
          </div>
        }
      </div>
      <div class="hero-metrics" aria-label="Năng lực và dịch vụ">
        <div data-hero-metric *ngFor="let metric of content.metrics" class="hero-metric min-w-0">
          <strong>{{ metric.value }}</strong>
          <span>{{ metric.label }}</span>
        </div>
      </div>
    </div>
  </div>
  <div class="hero-categories">
    @if (mobile) {
      <div class="hero-category-heading">
        <h2>Giải pháp của chúng tôi</h2>
        <span>3 ngành hàng</span>
      </div>
    }
    <div data-hero-media class="hero-card-grid min-w-0">
      <button *ngFor="let card of content.cards; trackBy: trackCard"
        data-industry-card type="button" class="hero-category-card"
        [attr.aria-label]="'Xem ' + card.title" (click)="navigate.emit(card.anchor)">
        <img appImgFallback [src]="card.imageSrc" [alt]="card.imageAlt" />
        <span class="hero-card-shade" aria-hidden="true"></span>
        <span class="hero-card-copy">
          <span class="hero-card-eyebrow">{{ card.eyebrow }}</span>
          <span class="hero-card-title text-white">{{ card.title }}</span>
          <span data-industry-description class="hero-card-description">{{ card.description }}</span>
          <span data-industry-link class="hero-card-link">
            <span>Xem ngành hàng</span>
            <mat-icon svgIcon="hero:arrow_forward"></mat-icon>
          </span>
        </span>
      </button>
    </div>
  </div>
</section>
