<section id="hero" class="relative overflow-hidden bg-slate-950 text-white">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(16,185,129,0.24),transparent_38%),radial-gradient(circle_at_bottom_right,rgba(14,165,233,0.18),transparent_35%)]"></div>
  <div class="absolute inset-0 opacity-[0.035] [background-image:linear-gradient(rgba(255,255,255,.8)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.8)_1px,transparent_1px)] [background-size:48px_48px]"></div>

  <div class="relative mx-auto grid max-w-7xl gap-12 px-4 py-16 md:px-8 lg:grid-cols-12 lg:items-center lg:px-12 lg:py-24">
    <div class="lg:col-span-5">
      <div class="inline-flex items-center gap-2 rounded-full border border-emerald-300/20 bg-emerald-300/10 px-4 py-2 text-xs font-black uppercase tracking-[0.18em] text-emerald-200">
        <span class="h-2 w-2 rounded-full bg-emerald-300 shadow-[0_0_16px_rgba(110,231,183,.9)]"></span>
        {{ content.badge }}
      </div>

      <h1 class="mt-7 text-4xl font-black leading-[1.06] tracking-tight text-white md:text-5xl lg:text-[3.45rem]">
        {{ content.title }}
        <span class="block bg-gradient-to-r from-emerald-300 via-sky-300 to-amber-300 bg-clip-text text-transparent">
          {{ content.highlightedTitle }}
        </span>
      </h1>
      <p class="mt-6 max-w-xl text-lg leading-8 text-slate-300">
        {{ content.description }}
      </p>

      <div class="mt-7 flex flex-wrap gap-2.5 text-sm font-bold">
        <span
          *ngFor="let card of content.cards; trackBy: trackCard"
          class="rounded-full border px-4 py-2"
          [ngClass]="themeClasses[card.kind].chip"
        >
          {{ card.title }}
        </span>
      </div>

      <div class="mt-9 grid gap-3 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-3">
        <a
          *ngFor="let card of content.cards; trackBy: trackCard"
          nz-button
          [routerLink]="listingPath"
          [queryParams]="queryParams(card.kind)"
          class="!inline-flex !h-12 !items-center !justify-center !rounded-full !border-none !px-5 !font-bold"
          [ngClass]="themeClasses[card.kind].button"
        >
          <mat-icon class="mr-2 !text-lg" [svgIcon]="'hero:' + card.icon"></mat-icon>
          {{ card.title }}
        </a>
      </div>

      <div class="mt-9 grid grid-cols-3 gap-5 border-t border-white/10 pt-7">
        <div *ngFor="let metric of content.metrics">
          <p class="text-2xl font-black md:text-3xl">{{ metric.value }}</p>
          <p class="mt-1 text-xs leading-5 text-slate-400">{{ metric.label }}</p>
        </div>
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-2 sm:grid-rows-2 lg:col-span-7 lg:h-[610px]">
      <button
        *ngFor="let card of content.cards; let index = index; trackBy: trackCard"
        data-industry-card
        type="button"
        (click)="navigate.emit(card.anchor)"
        class="group relative min-h-[280px] overflow-hidden rounded-[2rem] text-left shadow-2xl ring-1 ring-white/10"
        [ngClass]="cardLayout(index)"
      >
        <img
          [src]="card.imageSrc"
          [alt]="card.imageAlt"
          class="absolute inset-0 h-full w-full object-cover transition duration-700 group-hover:scale-105"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/10 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 p-6" [ngClass]="index === 0 ? 'md:p-8' : ''">
          <span class="text-xs font-black uppercase tracking-[0.18em]" [ngClass]="themeClasses[card.kind].text">
            {{ card.eyebrow }}
          </span>
          <h2 class="mt-1 font-black text-white" [ngClass]="index === 0 ? 'text-3xl' : 'text-2xl'">
            {{ card.title }}
          </h2>
          <p *ngIf="index === 0" class="mt-2 text-sm text-slate-200">{{ card.description }}</p>
          <span *ngIf="index === 0" class="mt-5 inline-flex items-center gap-2 text-sm font-black text-white">
            Xem ngành hàng
            <mat-icon class="!text-lg transition group-hover:translate-x-1" svgIcon="hero:arrow_forward"></mat-icon>
          </span>
        </div>
      </button>
    </div>
  </div>
</section>
