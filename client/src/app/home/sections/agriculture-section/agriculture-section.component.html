<section
  id="agriculture"
  class="relative overflow-hidden bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 py-20 md:py-24"
>
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(251,191,36,0.2),_transparent_50%)]"
  ></div>
  <div class="relative mx-auto max-w-7xl px-4 md:px-8 lg:px-12">
    <div
      class="mb-12 flex flex-col items-start justify-between gap-6 md:flex-row md:items-end"
    >
      <div>
        <p
          class="mb-3 inline-flex items-center gap-2 rounded-full bg-amber-100 px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-amber-800"
        >
          <i class="fa fa-tractor mr-1"></i> Giải pháp nông nghiệp
        </p>
        <h2
          class="text-3xl font-black tracking-tight text-slate-900 md:text-4xl"
        >
          Máy móc nông nghiệp hiện đại
        </h2>
        <p class="mt-3 max-w-2xl text-slate-700">
          Máy gặt, máy cày, máy bơm, máy phun thuốc và phụ tùng chính hãng – trợ
          thủ đắc lực cho mùa vụ bội thu, giảm sức người, tăng năng suất.
        </p>
      </div>
      <a
        [routerLink]="listingPath"
        [queryParams]="allMachinesQueryParams"
        nz-button
        nzType="default"
        class="!inline-flex !items-center !justify-center !rounded-full !border-amber-400 !text-amber-700 hover:!bg-amber-50"
      >
        Xem tất cả
      </a>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <app-product-card
        *ngFor="let p of featuredCardItems()"
        [product]="p"
      ></app-product-card>
    </div>
  </div>
</section>
