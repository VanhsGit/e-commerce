<section class="relative overflow-hidden bg-slate-900 text-white">
  <div
    class="mx-auto grid max-w-7xl gap-8 px-4 py-16 md:grid-cols-2 md:items-center md:px-6 lg:px-8"
  >
    <div>
      <p
        class="mb-3 text-sm font-semibold uppercase tracking-[0.3em] text-sky-300"
      >
        New season
      </p>
      <h1 class="text-4xl font-black tracking-tight md:text-6xl">
        Ride the winter mood.
      </h1>
      <p class="mt-6 max-w-lg text-lg text-slate-300">
        Discover performance gear, premium essentials, and style that keeps up
        with every adventure.
      </p>
      <div class="mt-8 flex flex-wrap gap-4">
        <button
          nz-button
          nzType="primary"
          routerLink="/shop"
          class="!rounded-full !px-6 !py-3"
        >
          Shop now
        </button>
        <button
          nz-button
          nzType="default"
          routerLink="/shop"
          class="!rounded-full !px-6 !py-3 !border-white !text-white"
        >
          Explore
        </button>
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <img
        src="assets/images/hero1.jpg"
        alt="Outdoor gear"
        class="h-72 w-full object-cover shadow-2xl sm:h-80"
      />
      <img
        src="assets/images/hero2.jpg"
        alt="Winter apparel"
        class="h-72 w-full object-cover shadow-2xl sm:h-80 sm:translate-y-8"
      />
      <img
        src="assets/images/hero3.jpg"
        alt="Accessories"
        class="h-72 w-full object-cover shadow-2xl sm:col-span-2 sm:h-60"
      />
    </div>
  </div>
</section>

<section class="mx-auto max-w-7xl px-4 py-12 md:px-6 lg:px-8">
  <div class="text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-sky-600">
      Welcome
    </p>
    <h2 class="mt-3 text-3xl font-bold text-slate-900">Welcome to the Shop!</h2>
  </div>
</section>
