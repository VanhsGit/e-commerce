<div class="mt-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm" [formGroup]="checkoutForm">
  <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h4 class="text-2xl font-bold text-slate-900">Shipping Address</h4>
    <button
      nz-button
      nzType="default"
      [disabled]="!checkoutForm.get('addressForm').valid || !checkoutForm.get('addressForm').dirty"
      (click)="saveUserAddress()"
      class="!rounded-xl !border-emerald-600 !bg-white !px-4 !py-2 !text-sm !font-semibold !text-emerald-600 hover:!bg-emerald-50 disabled:!cursor-not-allowed disabled:!opacity-50"
    >
      Save as default address
    </button>
  </div>

  <div class="grid gap-4 md:grid-cols-2" formGroupName="addressForm">
    <div>
      <app-text-input [label]="'First Name'" formControlName="firstName"></app-text-input>
    </div>
    <div>
      <app-text-input [label]="'Last Name'" formControlName="lastName"></app-text-input>
    </div>
    <div>
      <app-text-input [label]="'Street'" formControlName="street"></app-text-input>
    </div>
    <div>
      <app-text-input [label]="'City'" formControlName="city"></app-text-input>
    </div>
    <div>
      <app-text-input [label]="'State'" formControlName="state"></app-text-input>
    </div>
    <div>
      <app-text-input [label]="'Zip Code'" formControlName="zipcode"></app-text-input>
    </div>
  </div>
</div>

<div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <button nz-button nzType="default" class="!rounded-xl !border-sky-600 !bg-white !px-4 !py-3 !text-sm !font-semibold !text-sky-600 hover:!bg-sky-50" routerLink="/basket">
    <i class="fa fa-angle-left"></i> Back To Basket
  </button>
  <button nz-button nzType="primary" [disabled]="checkoutForm.get('addressForm').invalid" class="!rounded-xl !px-4 !py-3 !text-sm !font-semibold disabled:!cursor-not-allowed disabled:!opacity-60" cdkStepperNext>
    Go To Delivery <i class="fa fa-angle-right"></i>
  </button>
</div>
