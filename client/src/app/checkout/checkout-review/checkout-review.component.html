<div class="mt-6 border border-slate-200 bg-white p-6 shadow-sm">
  <app-basket-summary [isBasket]="false"></app-basket-summary>
</div>

<div
  class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
>
  <button
    nz-button
    nzType="default"
    class="!border-sky-600 !bg-white !px-4 !py-3 !text-sm !font-semibold !text-sky-600 hover:!bg-sky-50"
    cdkStepperPrevious
  >
    <i class="fa fa-angle-left"></i> Back To Delivery
  </button>
  <button
    nz-button
    nzType="primary"
    class="!px-4 !py-3 !text-sm !font-semibold"
    (click)="createPaymentIntent()"
  >
    Go To Payment <i class="fa fa-angle-right"></i>
  </button>
</div>
