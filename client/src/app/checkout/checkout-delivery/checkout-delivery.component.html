<div
  class="mt-6 border border-slate-200 bg-white p-6 shadow-sm"
  [formGroup]="checkoutForm"
>
  <h4 class="mb-6 text-2xl font-bold text-slate-900">
    Choose Your Delivery Method
  </h4>

  <nz-radio-group
    formControlName="deliveryMethod"
    class="grid gap-4 md:grid-cols-2"
    formGroupName="deliveryForm"
  >
    <label
      *ngFor="let method of deliveryMethods()"
      nz-radio
      [nzValue]="method.id"
      (click)="setShippingPrice(method)"
      class="flex items-start rounded-2xl border border-slate-200 bg-slate-50 p-4 transition hover:border-sky-300 hover:bg-sky-50"
    >
      <span class="block">
        <strong class="block text-base text-slate-900"
          >{{ method.shortName }} - {{ method.price | currency }}</strong
        >
        <span class="mt-1 block text-sm text-slate-600">{{
          method.description
        }}</span>
      </span>
    </label>
  </nz-radio-group>
</div>

<div
  class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
>
  <button
    nz-button
    nzType="default"
    class="!border-sky-600 !bg-white !px-4 !py-3 !text-sm !font-semibold !text-sky-600 hover:!bg-sky-50"
    cdkStepperPrevious
  >
    <i class="fa fa-angle-left"></i> Back To Address
  </button>
  <button
    nz-button
    nzType="primary"
    [disabled]="checkoutForm.get('deliveryForm').invalid"
    class="!px-4 !py-3 !text-sm !font-semibold disabled:!cursor-not-allowed disabled:!opacity-60"
    cdkStepperNext
  >
    Go To Review <i class="fa fa-angle-right"></i>
  </button>
</div>
