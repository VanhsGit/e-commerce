<div
  class="mx-auto mt-8 max-w-3xl border border-emerald-200 bg-emerald-50 p-8 text-center shadow-sm"
>
  <div class="mb-4 flex justify-center text-emerald-600">
    <i class="fa fa-check-circle fa-5x"></i>
  </div>
  <h2 class="text-3xl font-bold text-slate-900">
    Thank you, your order is confirmed
  </h2>
  <p class="mt-3 text-slate-600">
    Your order hasn't shipped yet, but this is to be expected as we are not a
    real store!
  </p>

  <div class="mt-6 flex justify-center gap-3">
    <button
      *ngIf="order"
      nz-button
      nzType="primary"
      routerLink="/orders/{{ order?.id }}"
    >
      View your order
    </button>
    <button *ngIf="!order" nz-button nzType="primary" routerLink="/orders">
      View your orders
    </button>
  </div>
</div>
