<header
  class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-4 py-3 sm:px-6 lg:px-8"
  >
    <a
      class="flex items-center gap-3"
      routerLink="/"
    >
      <div
        class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-600 via-indigo-600 to-violet-600 shadow-md"
      >
        <mat-icon class="text-white !text-xl" svgIcon="hero:bolt"></mat-icon>
      </div>
      <div>
        <p
          class="text-lg font-black tracking-tight leading-none text-slate-900"
        >
          EBike &amp; Agri
        </p>
        <p class="text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500">
          Official Store
        </p>
      </div>
    </a>

    <nav
      class="hidden items-center gap-6 text-sm font-semibold uppercase tracking-[0.2em] text-slate-600 md:flex"
    >
      <a
        class="transition hover:text-sky-600"
        routerLink="/"
        routerLinkActive="text-sky-600"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
    </nav>

    <div class="flex items-center gap-4">
      <ng-container *ngIf="currentUser() === null">
        <button
          nz-button
          nzType="primary"
          routerLink="/account/login"
          class="!rounded-full"
        >
          <mat-icon class="mr-1" svgIcon="hero:login"></mat-icon> Login
        </button>
      </ng-container>

      <ng-container *ngIf="currentUser() as currentUser">
        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-divider>
              <span class="px-4 py-1 text-[10px] font-bold uppercase tracking-[0.25em] text-sky-600"
                >Admin</span
              >
            </li>
            <li nz-menu-item>
              <a
                routerLink="/admin"
                class="flex items-center gap-3"
              >
                <mat-icon class="text-sky-700" svgIcon="hero:speed"></mat-icon>
                Dashboard
              </a>
            </li>
            <li nz-menu-item>
              <a
                routerLink="/admin/users"
                class="flex items-center gap-3"
              >
                <mat-icon class="text-emerald-700" svgIcon="hero:person_add"></mat-icon>
                Users
              </a>
            </li>
            <li nz-menu-divider></li>
            <li nz-menu-divider>
              <span class="px-4 py-1 text-[10px] font-bold uppercase tracking-[0.25em] text-sky-600"
                >Account</span
              >
            </li>
            <li nz-menu-item>
              <button
                type="button"
                (click)="logout()"
                class="!m-0 !flex !w-full !items-center !gap-3 !border-0 !bg-transparent !p-0 !text-left"
              >
                <mat-icon class="text-rose-700" svgIcon="hero:logout"></mat-icon>
                <span>Logout</span>
              </button>
            </li>
          </ul>
        </nz-dropdown-menu>

        <button
          nz-button
          nz-dropdown
          [nzDropdownMenu]="userMenu"
          nzType="text"
          class="!rounded-full !border !border-slate-200 !bg-slate-50 !px-4 !py-2 !shadow-sm"
        >
          <div
            class="mr-2 inline-flex h-7 w-7 items-center justify-center rounded-full bg-gradient-to-br from-sky-500 to-indigo-600 text-xs font-bold text-white"
          >
            {{ (currentUser.displayName || currentUser.email || 'U').charAt(0).toUpperCase() }}
          </div>
          <span class="text-sm font-semibold text-slate-700">
            {{ currentUser.displayName || currentUser.email }}
          </span>
          <mat-icon class="ml-2 !text-xs text-slate-500" svgIcon="mini:expand_more"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</header>
