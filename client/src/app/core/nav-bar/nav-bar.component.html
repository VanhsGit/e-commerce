<header
  class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-4 py-3 sm:px-6 lg:px-8"
  >
    <img
      src="/assets/images/logo.png"
      class="h-12 cursor-pointer object-contain"
      routerLink="/"
      alt="SkiNet"
    />

    <nav
      class="hidden items-center gap-6 text-sm font-semibold uppercase tracking-[0.2em] text-slate-600 md:flex"
    >
      <a
        class="transition hover:text-sky-600"
        routerLink="/"
        routerLinkActive="text-sky-600"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a
        class="transition hover:text-sky-600"
        routerLink="/shop"
        routerLinkActive="text-sky-600"
        >Shop</a
      >
      <a
        class="transition hover:text-sky-600"
        routerLink="/test-error"
        routerLinkActive="text-sky-600"
        >Errors</a
      >
    </nav>

    <div class="flex items-center gap-4">
      <a
        routerLink="/basket"
        class="relative inline-flex items-center text-slate-700 transition hover:text-sky-600"
      >
        <i class="fa fa-shopping-cart text-2xl"></i>
        <span
          *ngIf="itemCount() > 0"
          class="absolute -right-2 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-sky-600 px-1 text-[10px] font-bold text-white"
        >
          {{ itemCount() }}
        </span>
      </a>

      <ng-container *ngIf="currentUser() === null">
        <button
          nz-button
          nzType="primary"
          routerLink="/account/login"
          class="!rounded-full"
        >
          Login
        </button>
      </ng-container>

      <ng-container *ngIf="currentUser() as currentUser">
        <div class="relative group">
          <button nz-button nzType="text" class="!rounded-full text-slate-700">
            Welcome {{ currentUser.displayName }}
          </button>
          <div
            class="absolute right-0 top-full mt-2 hidden min-w-48 rounded-sm border border-slate-200 bg-white p-2 shadow-lg group-hover:block"
          >
            <a
              routerLink="/basket"
              class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
            >
              <i class="fa fa-shopping-cart"></i> View Basket
            </a>
            <a
              routerLink="/orders"
              class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
            >
              <i class="fa fa-history"></i> View Orders
            </a>
            <button
              type="button"
              (click)="logout()"
              class="mt-1 flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-100"
            >
              <i class="fa fa-sign-out"></i> Logout
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</header>
