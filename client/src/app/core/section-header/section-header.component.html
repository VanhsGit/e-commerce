<ng-container *ngIf="breadcrumb() as breadcrumbs">
  <section
    *ngIf="
      breadcrumbs.length > 0 &&
      breadcrumbs[breadcrumbs.length - 1].label != 'Home'
    "
    class="py-3"
    style="margin-top: 105px; background-color: #f5f5f5;"
  >
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div nz-row nzAlign="middle">
        <div nz-col nzSpan="18">
          <h1 class="m-0 text-2xl font-semibold text-slate-800">
            {{
              breadcrumbs.length > 0 &&
                breadcrumbs[breadcrumbs.length - 1].label | titlecase
            }}
          </h1>
        </div>
        <div nz-col nzSpan="6" class="text-right">
          <xng-breadcrumb></xng-breadcrumb>
        </div>
      </div>
    </div>
  </section>
</ng-container>
