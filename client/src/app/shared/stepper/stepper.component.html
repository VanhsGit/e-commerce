<div class="mx-auto max-w-6xl px-4 py-4">
  <div class="mb-6 grid gap-3 md:grid-cols-4">
    <button
      *ngFor="let step of steps; let i = index"
      nz-button
      type="button"
      (click)="onClick(i)"
      [disabled]="true"
      [nzType]="selectedIndex === i ? 'primary' : 'default'"
      class="  !px-4 !py-3 !text-xs !font-semibold !uppercase !tracking-[0.2em]"
    >
      {{ step.label }}
    </button>
  </div>

  <div>
    <ng-container [ngTemplateOutlet]="selected.content"></ng-container>
  </div>
</div>
