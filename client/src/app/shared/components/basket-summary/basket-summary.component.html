<ng-container *ngIf="basket()">
  <div
    class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
  >
    <nz-table
      [nzData]="basket().items"
      [nzShowPagination]="false"
      [nzBordered]="false"
      class="!text-sm !text-slate-700"
    >
      <thead>
        <tr>
          <th class="!px-4 !py-3 !font-semibold">Product</th>
          <th class="!px-4 !py-3 !font-semibold">Price</th>
          <th class="!px-4 !py-3 !font-semibold">Quantity</th>
          <th class="!px-4 !py-3 !font-semibold">Total</th>
          <th *ngIf="isBasket" class="!px-4 !py-3 !font-semibold">Remove</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of basket().items" class="align-middle">
          <td class="!px-4 !py-4">
            <div class="flex items-center gap-4">
              <img
                [src]="item.pictureUrl"
                [alt]="item.productName"
                class="h-14 w-14 rounded-sm object-cover ring-1 ring-slate-200"
              />
              <div>
                <a
                  routerLink="/shop/{{ item.id }}"
                  class="text-base font-semibold text-slate-900 hover:text-sky-600"
                >
                  {{ item.productName }}
                </a>
                <p class="mt-1 text-xs italic text-slate-500">
                  Type: {{ item.type }}
                </p>
              </div>
            </div>
          </td>
          <td class="!px-4 !py-4 !font-semibold !text-slate-900">
            {{ item.price | currency }}
          </td>
          <td class="!px-4 !py-4">
            <div
              class="flex items-center gap-2"
              [class.justify-center]="!isBasket"
            >
              <button
                *ngIf="isBasket"
                nz-button
                nzType="text"
                type="button"
                (click)="decrementItemQuantity(item)"
                class="!flex !h-8 !w-8 !items-center !justify-center !rounded-full !bg-slate-100 !text-lg !text-slate-700 hover:!bg-slate-200"
              >
                −
              </button>
              <span
                class="min-w-8 text-center text-lg font-semibold text-slate-900"
                >{{ item.quantity }}</span
              >
              <button
                *ngIf="isBasket"
                nz-button
                nzType="text"
                type="button"
                (click)="incrementItemQuantity(item)"
                class="!flex !h-8 !w-8 !items-center !justify-center !rounded-full !bg-slate-100 !text-lg !text-slate-700 hover:!bg-slate-200"
              >
                +
              </button>
            </div>
          </td>
          <td class="!px-4 !py-4 !font-semibold !text-slate-900">
            {{ item.price * item.quantity | currency }}
          </td>
          <td class="!px-4 !py-4 !text-center" *ngIf="isBasket">
            <button
              nz-button
              nzType="text"
              type="button"
              (click)="removeBasketItem(item)"
              class="!text-red-500 hover:!text-red-600"
              aria-label="Remove item"
            >
              <i class="fa fa-trash text-2xl"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>
</ng-container>
