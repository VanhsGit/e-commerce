<nav class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white p-2 shadow-sm" aria-label="Pagination">
  <button
    type="button"
    class="h-9 min-w-9 rounded-full border border-slate-200 px-3 text-sm font-medium text-slate-600 transition hover:border-sky-500 hover:text-sky-600 disabled:cursor-not-allowed disabled:opacity-40"
    [disabled]="!totalCount || currentPage === 1"
    (click)="onPagerChanged(1)"
  >
    First
  </button>

  <button
    type="button"
    class="h-9 min-w-9 rounded-full border border-slate-200 px-3 text-sm font-medium text-slate-600 transition hover:border-sky-500 hover:text-sky-600 disabled:cursor-not-allowed disabled:opacity-40"
    [disabled]="!totalCount || currentPage === 1"
    (click)="onPagerChanged(currentPage - 1)"
  >
    Prev
  </button>

  <button
    *ngFor="let page of pages"
    type="button"
    class="h-9 min-w-9 rounded-full border px-3 text-sm font-medium transition"
    [class.border-sky-500]="page === currentPage"
    [class.bg-sky-500]="page === currentPage"
    [class.text-white]="page === currentPage"
    [class.border-slate-200]="page !== currentPage"
    [class.text-slate-600]="page !== currentPage"
    [class.hover:border-sky-500]="page !== currentPage"
    [class.hover:text-sky-600]="page !== currentPage"
    (click)="onPagerChanged(page)"
  >
    {{ page }}
  </button>

  <button
    type="button"
    class="h-9 min-w-9 rounded-full border border-slate-200 px-3 text-sm font-medium text-slate-600 transition hover:border-sky-500 hover:text-sky-600 disabled:cursor-not-allowed disabled:opacity-40"
    [disabled]="!totalCount || currentPage === totalPages"
    (click)="onPagerChanged(currentPage + 1)"
  >
    Next
  </button>

  <button
    type="button"
    class="h-9 min-w-9 rounded-full border border-slate-200 px-3 text-sm font-medium text-slate-600 transition hover:border-sky-500 hover:text-sky-600 disabled:cursor-not-allowed disabled:opacity-40"
    [disabled]="!totalCount || currentPage === totalPages"
    (click)="onPagerChanged(totalPages)"
  >
    Last
  </button>
</nav>
