<div
  class="group overflow-hidden rounded-3xl border bg-white shadow-sm transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl"
  [ngClass]="accentClass()"
>
  <a [routerLink]="detailUrl()" class="block">
    <div class="relative overflow-hidden">
      <img
        [src]="product.pictureUrl"
        [alt]="product.name"
        class="h-56 w-full object-cover transition duration-700 group-hover:scale-110"
      />
      <span
        class="absolute left-3 top-3 rounded-full px-3 py-1 text-[11px] font-bold uppercase tracking-wider shadow backdrop-blur"
        [ngClass]="badgeClass()"
      >
        {{ product.categoryName }}
      </span>
    </div>
    <div class="space-y-3 p-5">
      <div
        class="text-xs font-semibold uppercase tracking-wider text-slate-500"
      >
        {{ product.brandName }} · {{ product.model }}
      </div>
      <h3
        class="line-clamp-2 min-h-[3rem] text-lg font-bold leading-snug text-slate-900 group-hover:text-emerald-700"
      >
        {{ product.name }}
      </h3>
      <p class="line-clamp-2 min-h-[2.5rem] text-sm text-slate-600">
        {{ product.description }}
      </p>
      <div class="flex flex-wrap gap-1.5 pt-1">
        <span
          *ngIf="product.chip1"
          class="rounded-full bg-slate-50 px-2.5 py-1 text-[11px] font-semibold text-slate-700 ring-1 ring-slate-100"
        >
          {{ product.chip1 }}
        </span>
        <span
          *ngIf="product.chip2"
          class="rounded-full bg-slate-50 px-2.5 py-1 text-[11px] font-semibold text-slate-700 ring-1 ring-slate-100"
        >
          {{ product.chip2 }}
        </span>
        <span
          *ngIf="product.chip3"
          class="rounded-full bg-slate-50 px-2.5 py-1 text-[11px] font-semibold text-slate-700 ring-1 ring-slate-100"
        >
          {{ product.chip3 }}
        </span>
      </div>
      <div
        class="mt-3 flex items-end justify-between border-t border-slate-100 pt-4"
      >
        <div>
          <p
            class="text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            Giá
          </p>
          <p
            class="text-2xl font-black"
            [ngClass]="priceClass()"
          >
            {{ formatCurrency(product.price) }}
          </p>
        </div>
      </div>
      <p class="text-xs text-slate-400">
        Cung cấp bởi: {{ product.companyName }}
      </p>
    </div>
  </a>
</div>
