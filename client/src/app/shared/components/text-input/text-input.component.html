<div class="relative">
  <label
    for="{{ label }}"
    class="mb-2 block text-sm font-medium text-slate-700"
    >{{ label }}</label
  >
  <input
    nz-input
    [ngClass]="
      controlDir && controlDir.control && controlDir.control.touched
        ? !controlDir.control.valid
          ? 'border-red-500'
          : 'border-emerald-500'
        : ''
    "
    [type]="type"
    (input)="onChange($event.target.value)"
    (blur)="onTouched()"
    [id]="label"
    [placeholder]="label"
    class="!h-12   !border-slate-200 !bg-slate-50 !text-slate-800 placeholder:!text-slate-400 focus:!border-sky-500 focus:!shadow-none"
  />

  <div
    *ngIf="
      controlDir &&
      controlDir.control &&
      controlDir.control.status === 'PENDING'
    "
    class="absolute right-3 top-11"
  >
    <i class="fa fa-spinner fa-spin text-sky-600"></i>
  </div>

  <div
    class="mt-2 min-h-[20px] text-sm text-red-600"
    *ngIf="
      controlDir &&
      controlDir.control &&
      !controlDir.control.valid &&
      controlDir.control.touched
    "
  >
    <span *ngIf="controlDir.control.errors?.required"
      >{{ label }} is required</span
    >
    <span *ngIf="controlDir.control.errors?.pattern"
      >Invalid email address</span
    >
  </div>

  <div
    class="mt-2 min-h-[20px] text-sm text-red-600"
    *ngIf="
      controlDir &&
      controlDir.control &&
      !controlDir.control.valid &&
      controlDir.control.dirty
    "
  >
    <span *ngIf="controlDir.control.errors?.emailExists"
      >Email address is in use</span
    >
  </div>
</div>
