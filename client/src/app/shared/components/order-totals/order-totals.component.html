<div class="rounded-2xl border border-slate-200 bg-slate-50 shadow-sm">
  <div class="border-b border-slate-200 bg-slate-100 px-5 py-4 text-xs font-semibold uppercase tracking-[0.2em] text-slate-600">
    Order Summary
  </div>
  <div class="p-5">
    <p class="mb-4 italic text-slate-500">Shipping costs will be added depending on choices made during checkout</p>
    <ul class="space-y-4" *ngIf="basketTotal()">
      <li class="flex items-center justify-between border-b border-slate-200 pb-3">
        <span class="text-slate-600">Order subtotal</span>
        <strong class="text-slate-900">{{ basketTotal().subtotal | currency }}</strong>
      </li>
      <li class="flex items-center justify-between border-b border-slate-200 pb-3">
        <span class="text-slate-600">Shipping and handling</span>
        <strong class="text-slate-900">{{ basketTotal().shipping | currency }}</strong>
      </li>
      <li class="flex items-center justify-between">
        <span class="text-slate-600">Total</span>
        <strong class="text-lg text-slate-900">{{ basketTotal().total | currency }}</strong>
      </li>
    </ul>
  </div>
</div>
