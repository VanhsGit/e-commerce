<div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
  <div *ngIf="basket() === null" class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-10 text-center text-slate-600">
    <p class="text-lg font-medium">There are no items in your basket</p>
  </div>

  <div *ngIf="basket()" class="space-y-8">
    <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
      <app-basket-summary
        (decrement)="decrementItemQuantity($event)"
        (increment)="incrementItemQuantity($event)"
        (remove)="removeBasketItem($event)"
      ></app-basket-summary>
    </div>

    <div class="ml-auto max-w-md rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <app-order-totals></app-order-totals>
      <a routerLink="/checkout" class="mt-6 inline-flex w-full items-center justify-center rounded-xl border border-sky-600 bg-sky-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-sky-500">
        Proceed to checkout
      </a>
    </div>
  </div>
</div>
